[project]
name = "ahlbatross"
description = "Tool for comparing and visualizing changes between AHB documents across different format version releases."
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info@hochfrequenz.de" }]
keywords = ["ahb"]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "efoli>=1.4.0",
    "kohlrahbi>=1.11.2",
    "pydantic>=2.10.6",
    "xlsxwriter>=3.2.0",
    "typer>=0.15.4"
]
dynamic = ["version"]

[project.scripts]
ahlbatross = "ahlbatross.main:cli"

[project.urls]
Changelog = "https://github.com/Hochfrequenz/ahlbatross/releases"
Homepage = "https://github.com/Hochfrequenz/ahlbatross"

[dependency-groups]
tests = [
    "pytest==9.1.1"
]
linting = [
    "ruff==0.16.0",
    {include-group = "tests"},
]
type_check = [
    "mypy==2.3.0",
    {include-group = "tests"},
]
spell_check = [
    "codespell==2.4.3"
]
coverage = [
    "coverage==7.15.2",
    {include-group = "tests"},
]
dev = [
    {include-group = "tests"},
    {include-group = "linting"},
    {include-group = "type_check"},
    {include-group = "coverage"},
    {include-group = "spell_check"},
]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "PL", "RUF"]
ignore = [
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"unittests/**" = ["PLR2004"] # magic-value-comparison is noisy in test assertions
"src/ahlbatross/core/ahb_processing.py" = ["PLR0914"] # too-many-locals, previously accepted via pylint pragma
"src/ahlbatross/core/ahb_multicomparison.py" = ["PLR0914"] # too-many-locals, previously accepted via pylint pragma
"src/ahlbatross/formats/xlsx.py" = ["PLR0914", "PLR0911"] # too-many-locals / too-many-return-statements, previously accepted via pylint pragmas

[mypy]
truethy-bool = true
[tool.mypy]
disable_error_code = []


[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_ahlbatross_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
