name: "Linting"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  pylint:
    name: "Python Code Quality and Lint (${{ matrix.linter-env }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - linter-env: linting
            group: linting
            commands: |
              uv run ruff check src unittests
          - linter-env: type_check
            group: type_check
            commands: |
              uv run mypy --show-error-codes src/ahlbatross --strict
              uv run mypy --show-error-codes unittests --strict
          - linter-env: spell_check
            group: spell_check
            commands: |
              uv run codespell src
              uv run codespell README.md
          - linter-env: test_packaging
            group: ""
            commands: |
              uv build
              uv publish --dry-run
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: 3.14
      - name: Install Dependencies
        if: matrix.group != ''
        run: uv sync --group ${{ matrix.group }}
      - name: Run ${{ matrix.linter-env }}
        run: ${{ matrix.commands }}
